<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img"><title>desktop-opening</title><desc>HELD TOGETHER — original static composition. Vertical single-support rest; second cable slack.</desc><style>@font-face{font-family:'Instrument Serif';src:url('../fonts/InstrumentSerif-Regular.ttf')}@font-face{font-family:'Inter';src:url('../fonts/Inter-variable.ttf');font-weight:100 900}</style><defs><linearGradient id="wall"><stop stop-color="#DED7C9"/><stop offset=".48" stop-color="#E7E1D5"/><stop offset=".78" stop-color="#EEE9DD"/><stop offset="1" stop-color="#D2CABA"/></linearGradient><linearGradient id="reveal"><stop stop-color="#ACAA9D" stop-opacity=".3"/><stop offset=".25" stop-color="#F7F2E6" stop-opacity=".8"/><stop offset="1" stop-color="#C4BBA8" stop-opacity=".1"/></linearGradient><linearGradient id="floor" x2="0" y2="1"><stop stop-color="#D0C8B7"/><stop offset="1" stop-color="#E1D9C9"/></linearGradient></defs><rect x="0" y="0" width="1440" height="900" fill="url(#wall)" opacity="1"/><rect x="510" y="0" width="25" height="900" fill="url(#reveal)" opacity="1"/><rect x="0" y="824" width="1440" height="76" fill="url(#floor)" opacity="1"/><rect x="0" y="824" width="1440" height="1" fill="#303A34" opacity="0.14"/><path d="M1120 0 H1310 L867 824 H559 Z" fill="#FFF9E8" opacity=".32"/><rect x="1368" y="0" width="72" height="824" fill="#B6A98E" opacity="0.14"/><path d="M950 824 L1158 900 M360 824 L241 900" stroke="#B6A98E" stroke-opacity=".3"/><g transform="translate(72 52) scale(1)"><text x="0" y="46.5" font-family="Instrument Serif" font-size="54" letter-spacing="-.54" fill="#303A34">HELD</text><path d="M0 55 H252" stroke="#303A34" stroke-width=".8"/><text x="31" y="99.5" font-family="Instrument Serif" font-size="54" letter-spacing="-.54" fill="#303A34">TOGETHER</text></g><defs><linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#83897D"/><stop offset=".16" stop-color="#BAC0AD"/><stop offset=".24" stop-color="#535D53"/><stop offset=".75" stop-color="#303A34"/><stop offset="1" stop-color="#202B26"/></linearGradient><linearGradient id="clay"><stop stop-color="#B8644B"/><stop offset=".65" stop-color="#A8503C"/><stop offset="1" stop-color="#823C2F"/></linearGradient></defs><rect x="798" y="115" width="20" height="10" fill="#B6A98E"/><rect x="803" y="125" width="10" height="9" rx="2" fill="#5A6256"/><circle cx="808" cy="129" r="2.2" fill="#E7E1D5"/><rect x="1158" y="115" width="20" height="10" fill="#B6A98E"/><rect x="1163" y="125" width="10" height="9" rx="2" fill="#5A6256"/><circle cx="1168" cy="129" r="2.2" fill="#E7E1D5"/><path d="M808 133 V302" stroke="#303A34" stroke-width="1.4"/><path d="M1168 133 Q1168 662.0000006705523 808 662" fill="none" stroke="#697064" stroke-width="1.4"/><rect x="824" y="322" width="9.6" height="360" fill="#303A34" opacity=".045"/><rect x="803.2" y="302" width="9.6" height="360" fill="url(#steel)"/><path d="M803.2 302 V662" stroke="#C1C1B0" stroke-width=".9"/><path d="M808 666.8 V704" stroke="#303A34" stroke-width="1.2"/><rect x="804" y="658" width="8" height="8" rx="1" fill="#B6A98E"/><path d="M788.8 708 L792.8 704 H823.2 L827.2 708 V756.8 H788.8 Z" fill="url(#clay)"/><path d="M789.8 708 V755.8" stroke="#D08567" stroke-width="1" opacity=".5"/><circle cx="808" cy="711" r="2" fill="#623D30"/><text x="74" y="211.04" font-family="Inter" font-size="13" font-weight="400" fill="#303A34"><tspan x="74" dy="0">An interactive sculpture</tspan></text><text x="74" y="301.12" font-family="Inter" font-size="14" font-weight="500" fill="#303A34"><tspan x="74" dy="0">Held by one support</tspan></text><text x="72" y="400.8" font-family="Instrument Serif" font-size="40" font-weight="400" fill="#303A34"><tspan x="72" dy="0">A span, waiting</tspan><tspan x="72" dy="43.2">to happen.</tspan></text><text x="72" y="488.2" font-family="Inter" font-size="15" font-weight="400" fill="#303A34"><tspan x="72" dy="0">One cable holds the beam at rest.</tspan><tspan x="72" dy="