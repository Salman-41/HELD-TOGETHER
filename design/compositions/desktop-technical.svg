<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img"><title>desktop-technical</title><desc>HELD TOGETHER — original static composition. Force drawing at load position 2.25 m.</desc><style>@font-face{font-family:'Instrument Serif';src:url('../fonts/InstrumentSerif-Regular.ttf')}@font-face{font-family:'Inter';src:url('../fonts/Inter-variable.ttf');font-weight:100 900}</style><defs><linearGradient id="wall"><stop stop-color="#DED7C9"/><stop offset=".48" stop-color="#E7E1D5"/><stop offset=".78" stop-color="#EEE9DD"/><stop offset="1" stop-color="#D2CABA"/></linearGradient><linearGradient id="reveal"><stop stop-color="#ACAA9D" stop-opacity=".3"/><stop offset=".25" stop-color="#F7F2E6" stop-opacity=".8"/><stop offset="1" stop-color="#C4BBA8" stop-opacity=".1"/></linearGradient><linearGradient id="floor" x2="0" y2="1"><stop stop-color="#D0C8B7"/><stop offset="1" stop-color="#E1D9C9"/></linearGradient></defs><rect x="0" y="0" width="1440" height="900" fill="#F2EEE5" opacity="1"/><rect x="510" y="0" width="1" height="900" fill="#B6A98E" opacity="0.2"/><g transform="translate(72 52) scale(1)"><text x="0" y="46.5" font-family="Instrument Serif" font-size="54" letter-spacing="-.54" fill="#303A34">HELD</text><path d="M0 55 H252" stroke="#303A34" stroke-width=".8"/><text x="31" y="99.5" font-family="Instrument Serif" font-size="54" letter-spacing="-.54" fill="#303A34">TOGETHER</text></g><defs><linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#83897D"/><stop offset=".16" stop-color="#BAC0AD"/><stop offset=".24" stop-color="#535D53"/><stop offset=".75" stop-color="#303A34"/><stop offset="1" stop-color="#202B26"/></linearGradient><linearGradient id="clay"><stop stop-color="#B8644B"/><stop offset=".65" stop-color="#A8503C"/><stop offset="1" stop-color="#823C2F"/></linearGradient></defs><path d="M592 105 V420 M1222 105 V420" stroke="#B6A98E" stroke-width="1" stroke-dasharray="3 6" opacity=".45"/><rect x="592" y="411.6" width="630" height="16.8" fill="none" stroke="#303A34" stroke-width="1.1"/><path d="M1064.5 420 V493.5" stroke="#A8503C" opacity=".2"/><rect x="1030.9" y="493.5" width="67.2" height="92.4" fill="none" stroke="#A8503C" stroke-width="1" opacity=".25"/><path d="M592 420 V345.444 M588 352.444 L592 345.444 L596 352.444" fill="none" stroke="#303A34" stroke-width="1.65"/><path d="M1222 420 V308.166 M1218 315.166 L1222 308.166 L1226 315.166" fill="none" stroke="#303A34" stroke-width="1.65"/><path d="M907 420 V531.834 M903 524.834 L907 531.834 L911 524.834" fill="none" stroke="#303A34" stroke-width="1.65"/><path d="M1064.5 420 V494.556 M1060.5 487.556 L1064.5 494.556 L1068.5 487.556" fill="none" stroke="#A8503C" stroke-width="1.65"/><path d="M592 651 V661 M1222 651 V661 M592 656 H1222 M592 616 V624 M1064.5 616 V624 M592 620 H1064.5" stroke="#7A8074" stroke-width=".8" fill="none"/><text x="74" y="211.04" font-family="Inter" font-size="13" font-weight="400" fill="#303A34"><tspan x="74" dy="0">An interactive sculpture</tspan></text><text x="74" y="301.12" font-family="Inter" font-size="14" font-weight="500" fill="#303A34"><tspan x="74" dy="0">Force drawing</tspan></text><text x="72" y="400.8" font-family="Instrument Serif" font-size="40" font-weight="400" fill="#303A34"><tspan x="72" dy="0">How the weight</tspan><tspan x="72" dy="43.2">is shared.</tspan></text><text x="72" y="488.2" font-family="Inter" font-size="15" font-weight="400" fill="#303A34"><tspan x="72" dy="0">The same beam, with its forces made visible.</tspan></text><text x="569" y="325.12" font-family="Inter" font-size="14" font-weight="500" fill="#303A34"><tspan x="569" dy="0">A · 78.48 N</tspan></text><text x="1174" y="284.12" font-family="Inter" font-size="14" font-weight="500" fill="#303A34"><tspan x="1174" dy="0">B · 117.72 N</tspan></text><text x="816" y="559.04" font-family="Inter" font-size="13" font-weight="400" fill="#303A34"><tspan x="816" dy="0">Beam weight</tspan></text><text x="816" y="583.12" font-family="Inter" font-size="14" font-weight="500" fill="#303A34"><tspan x="816" dy="0">W · 117.72 N</tspan></text><text x="1091.5" y="478.04" font-family="Inter" font-size="13" font-weight="400" fill="#A8503C"><tspan x="1091.5" dy="0">Hanging weight</tspan></text><text x="1091.5" y="502.12" font-family="Inter" font-size="14" font-weight="500" fill="#A8503C"><tspan x="1091.5" dy="0">P · 78.48 N</tspan></text><text x="793.25" y="638.04" font-family="Inter" font-size="13" font-weight="400" fill="#303A34"><tspan x="793.25" dy="0">s = 2.25 m</tspan></text><text x="871" y="675.04" font-family="Inter" font-size="13" font-weight="400" fill="#303A34"><tspan x="871" dy="0">L = 3.00 m</tspan></text><text x="74" y="579.2" font-family="Inter" font-size="15" font-weight="400" fill="#303A34"><tspan x="74" dy="0">A + B = W + P = 196.20 N</tspan></text><text x="74" y="610.2" font-family="Inter" font-size="15" font-weight="400" fill="#303A34"><tspan x="74" dy="0">B · L = W · L/2 + P · s</tspan></text><text x="74" y="704.04" font-family="Inter" font-size="13" font-weight="400" fill="#303A34"><tspan x="74" dy="0">Uniform beam 12 kg · hanging weight 8 kg</tspan><tspan x="74" dy="19.5">g = 9.81 m/s² · beam self-weight included</tspan></text><text x="74" y="760.04" font-family="Inter" font-size="13" font-weight="400" fill="#535B52"><tspan x="74" dy="0">Virtual parameters. Static equilibrium only.</tspan></text><text x="592" y="750.12" font-family="Inter" font-size="14" font-weight="400" fill="#303A34"><tspan x="592" dy="0">Upward support balances downward weight.</tspan></text><text x="592" y="776.04" font-family="Inter" font-size="13" font-weight="400" fill="#535B52"><tspan x="592" dy="0">Arrow lengths share one force scale.</tspan></text><g aria-label="Return to sculpture"><rect x="1200" y="829" width="144.4" height="44" fill="none"/><text x="1200" y="857" font-family="Inter" font-size="14" font-weight="500" text-decoration="underline" fill="#303A34">Return to sculpture</text></g></svg>