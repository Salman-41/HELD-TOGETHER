idth="282" height="7.5200000000000005" fill="none" stroke="#303A34" stroke-width="1.1"/><path d="M265.5 352 V384.9" stroke="#A8503C" opacity=".2"/><rect x="250.46" y="384.9" width="30.080000000000002" height="41.36" fill="none" stroke="#A8503C" stroke-width="1" opacity=".25"/><path d="M54 352 V300.988 M50 307.988 L54 300.988 L58 307.988" fill="none" stroke="#303A34" stroke-width="1.65"/><path d="M336 352 V275.48199999999997 M332 282.48199999999997 L336 275.48199999999997 L340 282.48199999999997" fill="none" stroke="#303A34" stroke-width="1.65"/><path d="M195 352 V428.51800000000003 M191 421.51800000000003 L195 428.51800000000003 L199 421.51800000000003" fill="none" stroke="#303A34" stroke-width="1.65"/><path d="M265.5 352 V403.012 M261.5 396.012 L265.5 403.012 L269.5 396.012" fill="none" stroke="#A8503C" stroke-width="1.65"/><path d="M54 501 V511 M336 501 V511 M54 506 H336 M54 468 V476 M265.5 468 V476 M54 472 H265.5" stroke="#7A8074" stroke-width=".8" fill="none"/><g aria-label="Close"><rect x="321" y="34" width="44" height="44" fill="none"/><text x="321" y="62" font-family="Inter" font-size="14" font-weight="500" text-decoration="underline" fill="#303A34">Close</text></g><text x="24" y="168.1" font-family="Instrument Serif" font-size="30" font-weight="400" fill="#303A34"><tspan x="24" dy="0">How it is held</tspan></text><text x="24" y="206.12" font-family="Inter" font-size="14" font-weight="400" fill="#303A34"><tspan x="24" dy="0">The same beam. Its forces revealed.</tspan></text><text x="24" y="280.04" font-family="Inter" font-size="13" font-weight="500" fill="#303A34"><tspan x="24" dy="0">A · 78.48 N</tspan></text><text x="262" y="254.04" font-family="Inter" font-size="13" font-weight="500" fill="#303A34"><tspan x="262" dy="0">B · 117.72 N</tspan></text><text x="117" y="448.96" font-family="Inter" font-size="12" font-weight="400" fill="#303A34"><tspan x="117" dy="0">W · beam</tspan></text><text x="117" y="468.04" font-family="Inter" font-size="13" font-weight="500" fill="#303A34"><tspan x="117" dy="0">117.72 N</tspan></text><text x="282" y="408.96" font-family="Inter" font-size="12" font-weight="400" fill="#A8503C"><tspan x="282" dy="0">P · load</tspan></text><text x="282" y="429.04" font-family="Inter" font-size="13" font-weight="500" fill="#A8503C"><tspan x="282" dy="0">78.48 N</tspan></text><text x="118" y="490.96" font-family="Inter" font-size="12" font-weight="400" fill="#303A34"><tspan x="118" dy="0">s = 2.25 m</tspan></text><text x="162" y="524.96" font-family="Inter" font-size="12" font-weight="400" fill="#303A34"><tspan x="162" dy="0">L = 3.00 m</tspan></text><text x="24" y="581.2" font-family="Inter" font-size="15" font-weight="400" fill="#303A34"><tspan x="24" dy="0">A + B = W + P = 196.20 N</tspan></text><text x="24" y="610.2" font-family="Inter" font-size="15" font-weight="400" fill="#303A34"><tspan x="24" dy="0">B · L = W · L/2 + P · s</tspan></text><text x="24" y="668.04" font-family="Inter" font-size="13" font-weight="400" fill="#303A34"><tspan x="24" dy="0">Uniform beam 12 kg · weight 8 kg</tspan><tspan x="24" dy="19.5">g = 9.81 m/s² · self-weight included</tspan></text><text x="24" y="724.04" font-family="Inter" font-size="13" font-weight="400" fill="#535B52"><tspan x="24" dy="0">Virtual parameters. Static equilibrium only.</tspan><tspan x="24" dy="19.5">Arrows share one force scale.</tspan></text><g aria-label="Return to sculpture"><rect x="24" y="779" width="144.4" height="44" fill="none"/><text x="24" y="807" font-family="Inter" font-size="14" font-weight="500" text-decoration="underline" fill="#303A34">Return to sculpture</text></g></svg>